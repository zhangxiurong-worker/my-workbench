<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我的工作台</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --primary: #FFC300;
    --primary-dark: #E6AF00;
    --bg: #F5F6FA;
    --card: #FFFFFF;
    --text: #2B2B33;
    --text-sub: #8A8A96;
    --red: #FF5A5F;
    --green: #34C759;
    --blue: #4A90D9;
    --orange: #FF9500;
    --shadow: 0 2px 12px rgba(0,0,0,0.06);
  }

  body {
    font-family: "PingFang SC", "Microsoft YaHei", -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }

  /* 顶部栏 */
  header {
    background: linear-gradient(135deg, #FFC300 0%, #FFD75E 100%);
    padding: 28px 32px 24px;
    color: #4A3800;
  }
  .header-inner {
    max-width: 960px;
    margin: 0 auto;
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    flex-wrap: wrap;
    gap: 12px;
  }
  header h1 { font-size: 26px; letter-spacing: 1px; }
  header .date-info { font-size: 14px; opacity: 0.85; margin-top: 6px; }

  .greeting { font-size: 14px; background: rgba(255,255,255,0.45); padding: 8px 16px; border-radius: 20px; }

  main { max-width: 960px; margin: 0 auto; padding: 24px 32px 60px; }

  /* 统计卡片 */
  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 24px; }
  .stat-card {
    background: var(--card); border-radius: 14px; padding: 18px 20px;
    box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 4px;
  }
  .stat-card .num { font-size: 30px; font-weight: 700; }
  .stat-card .label { font-size: 13px; color: var(--text-sub); }
  .stat-card.total .num { color: var(--blue); }
  .stat-card.doing .num { color: var(--orange); }
  .stat-card.done .num { color: var(--green); }
  .stat-card.overdue .num { color: var(--red); }

  /* 进度条 */
  .progress-wrap { background: var(--card); border-radius: 14px; padding: 16px 20px; box-shadow: var(--shadow); margin-bottom: 24px; }
  .progress-head { display: flex; justify-content: space-between; font-size: 14px; margin-bottom: 10px; }
  .progress-head b { color: var(--primary-dark); }
  .progress-bar { height: 10px; background: #EEEEF2; border-radius: 5px; overflow: hidden; }
  .progress-bar .fill { height: 100%; background: linear-gradient(90deg, #FFC300, #FFB300); border-radius: 5px; transition: width 0.4s ease; width: 0; }

  /* 输入区 */
  .input-card {
    background: var(--card); border-radius: 14px; padding: 18px 20px;
    box-shadow: var(--shadow); margin-bottom: 24px;
  }
  .input-row { display: flex; gap: 10px; margin-bottom: 12px; }
  .input-row input[type="text"] {
    flex: 1; border: 2px solid #EEEEF2; border-radius: 10px;
    padding: 12px 14px; font-size: 15px; outline: none; transition: border-color 0.2s;
  }
  .input-row input[type="text"]:focus { border-color: var(--primary); }
  .add-btn {
    background: var(--primary); color: #4A3800; border: none; border-radius: 10px;
    padding: 0 26px; font-size: 15px; font-weight: 600; cursor: pointer; transition: background 0.2s;
  }
  .add-btn:hover { background: var(--primary-dark); }
  .meta-row { display: flex; gap: 14px; flex-wrap: wrap; align-items: center; }
  .meta-row label { font-size: 13px; color: var(--text-sub); display: flex; align-items: center; gap: 6px; }
  .meta-row select, .meta-row input[type="date"] {
    border: 1.5px solid #EEEEF2; border-radius: 8px; padding: 6px 8px; font-size: 13px;
    outline: none; background: #FAFAFC; cursor: pointer;
  }
  .meta-row select:focus, .meta-row input[type="date"]:focus { border-color: var(--primary); }

  /* 筛选 */
  .toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; flex-wrap: wrap; gap: 10px; }
  .filters { display: flex; gap: 8px; }
  .filter-btn {
    border: none; background: transparent; color: var(--text-sub);
    padding: 7px 16px; border-radius: 18px; font-size: 13px; cursor: pointer; transition: all 0.2s;
  }
  .filter-btn.active { background: #FFF3CC; color: #8A6D00; font-weight: 600; }
  .clear-done {
    border: none; background: transparent; color: var(--text-sub); font-size: 13px;
    cursor: pointer; text-decoration: underline; padding: 6px;
  }
  .clear-done:hover { color: var(--red); }

  /* 待办列表 */
  .todo-list { display: flex; flex-direction: column; gap: 10px; }
  .todo-item {
    background: var(--card); border-radius: 12px; padding: 14px 18px;
    box-shadow: var(--shadow); display: flex; align-items: center; gap: 14px;
    transition: transform 0.15s, opacity 0.3s; animation: slideIn 0.25s ease;
  }
  @keyframes slideIn { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: none; } }
  .todo-item:hover { transform: translateY(-2px); }
  .todo-item.done { opacity: 0.55; }
  .todo-item.done .todo-title { text-decoration: line-through; color: var(--text-sub); }

  /* 自定义复选框 */
  .checkbox {
    width: 22px; height: 22px; min-width: 22px; border: 2px solid #D5D5DD; border-radius: 50%;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    transition: all 0.2s; color: transparent; font-size: 13px;
  }
  .checkbox:hover { border-color: var(--green); }
  .checkbox.checked { background: var(--green); border-color: var(--green); color: white; }

  .todo-body { flex: 1; min-width: 0; }
  .todo-title { font-size: 15px; word-break: break-all; }
  .todo-tags { display: flex; gap: 6px; margin-top: 6px; flex-wrap: wrap; }
  .tag {
    font-size: 11px; padding: 2px 9px; border-radius: 10px; font-weight: 500;
  }
  .tag.high   { background: #FFE5E5; color: #C0392B; }
  .tag.mid    { background: #FFF3D6; color: #B8860B; }
  .tag.low    { background: #E8F5E9; color: #2E7D32; }
  .tag.due    { background: #EAF2FB; color: #3A6EA5; }
  .tag.due.overdue { background: #FFE5E5; color: var(--red); }
  .tag.due.today { background: #FFF0D6; color: #D97B00; }

  .del-btn {
    border: none; background: transparent; color: #C8C8D0; font-size: 18px;
    cursor: pointer; padding: 4px 8px; border-radius: 8px; transition: all 0.2s;
  }
  .del-btn:hover { color: var(--red); background: #FFF0F0; }

  .empty {
    text-align: center; color: var(--text-sub); padding: 48px 0; font-size: 14px;
  }
  .empty .emoji { font-size: 40px; display: block; margin-bottom: 12px; }

  /* 分类 tab */
  .cat-bar { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
  .cat-tab {
    border: 1.5px solid #EEEEF2; background: var(--card); border-radius: 18px;
    padding: 6px 16px; font-size: 13px; cursor: pointer; color: var(--text-sub); transition: all 0.2s;
  }
  .cat-tab.active { border-color: var(--primary); background: #FFF9E5; color: #8A6D00; font-weight: 600; }

  footer { text-align: center; font-size: 12px; color: #BFBFC8; padding: 20px; }

  @media (max-width: 640px) {
    .stats { grid-template-columns: repeat(2, 1fr); }
    main { padding: 16px; }
    header { padding: 20px 16px; }
  }
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <div>
      <h1>🐾 我的工作台</h1>
      <div class="date-info" id="dateInfo"></div>
    </div>
    <div class="greeting" id="greeting"></div>
  </div>
</header>

<main>
  <!-- 统计 -->
  <div class="stats">
    <div class="stat-card total"><span class="num" id="statTotal">0</span><span class="label">全部任务</span></div>
    <div class="stat-card doing"><span class="num" id="statDoing">0</span><span class="label">进行中</span></div>
    <div class="stat-card done"><span class="num" id="statDone">0</span><span class="label">已完成</span></div>
    <div class="stat-card overdue"><span class="num" id="statOverdue">0</span><span class="label">已逾期</span></div>
  </div>

  <!-- 进度 -->
  <div class="progress-wrap">
    <div class="progress-head"><span>完成进度</span><b id="progressText">0%</b></div>
    <div class="progress-bar"><div class="fill" id="progressFill"></div></div>
  </div>

  <!-- 输入 -->
  <div class="input-card">
    <div class="input-row">
      <input type="text" id="todoInput" placeholder="添加新任务，按回车快速提交…" maxlength="100">
      <button class="add-btn" onclick="addTodo()">添加</button>
    </div>
    <div class="meta-row">
      <label>优先级
        <select id="prioSelect">
          <option value="high">🔴 高</option>
          <option value="mid" selected>🟡 中</option>
          <option value="low">🟢 低</option>
        </select>
      </label>
      <label>分类
        <select id="catSelect">
          <option value="工作" selected>工作</option>
          <option value="学习">学习</option>
          <option value="生活">生活</option>
          <option value="其他">其他</option>
        </select>
      </label>
      <label>截止日期 <input type="date" id="dueInput"></label>
    </div>
  </div>

  <!-- 筛选 -->
  <div class="toolbar">
    <div class="cat-bar" id="catBar"></div>
    <div class="filters">
      <button class="filter-btn active" data-filter="all">全部</button>
      <button class="filter-btn" data-filter="doing">进行中</button>
      <button class="filter-btn" data-filter="done">已完成</button>
      <button class="clear-done" onclick="clearDone()">清空已完成</button>
    </div>
  </div>

  <!-- 列表 -->
  <div class="todo-list" id="todoList"></div>
</main>

<footer>数据保存在浏览器本地，请勿清除浏览器缓存 · 刷新页面数据不丢失</footer>

<script>
const STORE_KEY = 'my-workbench-todos';
let todos = JSON.parse(localStorage.getItem(STORE_KEY) || '[]');
let filter = 'all';
let catFilter = '全部';

function save() { localStorage.setItem(STORE_KEY, JSON.stringify(todos)); }

function todayStr() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

/* ---------- 顶部日期与问候 ---------- */
function renderHeader() {
  const d = new Date();
  const weeks = ['日','一','二','三','四','五','六'];
  document.getElementById('dateInfo').textContent =
    `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日 · 星期${weeks[d.getDay()]}`;
  const h = d.getHours();
  let g = h < 6 ? '夜深了，注意休息 🌙' : h < 12 ? '早上好，元气满满！☀️' :
          h < 14 ? '中午好，记得吃饭 🍚' : h < 18 ? '下午好，继续加油 💪' : '晚上好，辛苦了 🌆';
  document.getElementById('greeting').textContent = g;
}

/* ---------- 增删改 ---------- */
function addTodo() {
  const input = document.getElementById('todoInput');
  const text = input.value.trim();
  if (!text) { input.focus(); return; }
  todos.unshift({
    id: Date.now(),
    text,
    done: false,
    priority: document.getElementById('prioSelect').value,
    cat: document.getElementById('catSelect').value,
    due: document.getElementById('dueInput').value || '',
    createdAt: todayStr()
  });
  input.value = '';
  document.getElementById('dueInput').value = '';
  save(); render();
}

function toggleTodo(id) {
  const t = todos.find(t => t.id === id);
  if (t) { t.done = !t.done; save(); render(); }
}

function delTodo(id) {
  todos = todos.filter(t => t.id !== id);
  save(); render();
}

function clearDone() {
  todos = todos.filter(t => !t.done);
  save(); render();
}

/* ---------- 渲染 ---------- */
const prioLabel = { high: '高优先', mid: '中优先', low: '低优先' };

function dueTag(t) {
  if (!t.due) return '';
  const today = todayStr();
  if (!t.done && t.due < today) return `<span class="tag due overdue">逾期 · ${t.due.slice(5)}</span>`;
  if (!t.done && t.due === today) return `<span class="tag due today">今天截止</span>`;
  return `<span class="tag due">截止 ${t.due.slice(5)}</span>`;
}

function render() {
  renderHeader();

  /* 统计 */
  const total = todos.length;
  const done = todos.filter(t => t.done).length;
  const today = todayStr();
  const overdue = todos.filter(t => !t.done && t.due && t.due < today).length;
  document.getElementById('statTotal').textContent = total;
  document.getElementById('statDoing').textContent = total - done;
  document.getElementById('statDone').textContent = done;
  document.getElementById('statOverdue').textContent = overdue;
  const pct = total ? Math.round(done / total * 100) : 0;
  document.getElementById('progressText').textContent = pct + '%';
  document.getElementById('progressFill').style.width = pct + '%';

  /* 分类 tab */
  const cats = ['全部', ...new Set(todos.map(t => t.cat))];
  document.getElementById('catBar').innerHTML = cats.map(c =>
    `<button class="cat-tab ${c === catFilter ? 'active' : ''}" onclick="setCatFilter('${c}')">${c}</button>`
  ).join('');

  /* 列表 */
  let list = todos.filter(t => {
    if (filter === 'doing' && t.done) return false;
    if (filter === 'done' && !t.done) return false;
    if (catFilter !== '全部' && t.cat !== catFilter) return false;
    return true;
  });
  /* 排序：未完成在前，高优先在前 */
  list.sort((a, b) => {
    if (a.done !== b.done) return a.done ? 1 : -1;
    const po = { high: 0, mid: 1, low: 2 };
    if (po[a.priority] !== po[b.priority]) return po[a.priority] - po[b.priority];
    return b.id - a.id;
  });

  const el = document.getElementById('todoList');
  if (!list.length) {
    el.innerHTML = `<div class="empty"><span class="emoji">🎉</span>${total ? '当前筛选下没有任务' : '太棒了，暂无待办！去添加一个新任务吧'}</div>`;
    return;
  }
  el.innerHTML = list.map(t => `
    <div class="todo-item ${t.done ? 'done' : ''}">
      <div class="checkbox ${t.done ? 'checked' : ''}" onclick="toggleTodo(${t.id})">✓</div>
      <div class="todo-body">
        <div class="todo-title">${escapeHtml(t.text)}</div>
        <div class="todo-tags">
          <span class="tag ${t.priority}">${prioLabel[t.priority]}</span>
          <span class="tag mid">${t.cat}</span>
          ${dueTag(t)}
        </div>
      </div>
      <button class="del-btn" title="删除" onclick="delTodo(${t.id})">✕</button>
    </div>
  `).join('');
}

function escapeHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function setCatFilter(c) { catFilter = c; render(); }

/* 事件绑定 */
document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    filter = btn.dataset.filter;
    render();
  });
});
document.getElementById('todoInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') addTodo();
});
/* 默认截止日期为今天 */
document.getElementById('dueInput').value = todayStr();

render();
</script>
</body>
</html>
