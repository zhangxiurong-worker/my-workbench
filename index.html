<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我的工作台 · 团队版</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --primary: #FFC300; --primary-dark: #E6AF00;
    --bg: #F5F6FA; --card: #FFFFFF;
    --text: #2B2B33; --text-sub: #8A8A96;
    --red: #FF5A5F; --green: #34C759; --blue: #4A90D9;
    --shadow: 0 2px 12px rgba(0,0,0,0.06);
  }
  body { font-family: "PingFang SC","Microsoft YaHei",-apple-system,sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

  header { background: linear-gradient(135deg,#FFC300 0%,#FFD75E 100%); padding: 24px 20px; color: #4A3800; }
  .header-inner { max-width: 680px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
  header h1 { font-size: 22px; letter-spacing: 1px; }
  .date-info { font-size: 13px; opacity: 0.85; margin-top: 4px; }
  .sync-pill { font-size: 12px; background: rgba(255,255,255,0.5); padding: 6px 14px; border-radius: 16px; display: flex; align-items: center; gap: 6px; white-space: nowrap; }
  .sync-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); }
  .sync-pill.syncing .sync-dot { background: var(--primary-dark); animation: blink 1s infinite; }
  .sync-pill.offline .sync-dot { background: var(--red); }
  @keyframes blink { 50% { opacity: 0.3; } }

  main { max-width: 680px; margin: 0 auto; padding: 18px 16px 60px; }

  .card { background: var(--card); border-radius: 14px; padding: 18px; box-shadow: var(--shadow); margin-bottom: 16px; }
  .card h2 { font-size: 16px; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
  .card h2 .sub { font-size: 12px; color: var(--text-sub); font-weight: 400; }

  .stats { display: grid; grid-template-columns: repeat(3,1fr); gap: 12px; margin-bottom: 16px; }
  .stat-card { background: var(--card); border-radius: 14px; padding: 14px; box-shadow: var(--shadow); text-align: center; }
  .stat-card .num { font-size: 26px; font-weight: 700; }
  .stat-card .label { font-size: 12px; color: var(--text-sub); margin-top: 2px; }

  .input-row { display: flex; gap: 10px; }
  .input-row input { flex: 1; border: 2px solid #EEEEF2; border-radius: 10px; padding: 11px 14px; font-size: 15px; outline: none; }
  .input-row input:focus { border-color: var(--primary); }
  .btn { background: var(--primary); color: #4A3800; border: none; border-radius: 10px; padding: 11px 22px; font-size: 15px; font-weight: 600; cursor: pointer; }
  .btn:active { background: var(--primary-dark); }
  .btn.ghost { background: #FFF3CC; }
  .btn.small { padding: 7px 14px; font-size: 13px; }
  .btn.danger { background: #FFECEC; color: #C0392B; }

  .check-item { display: flex; align-items: center; gap: 14px; padding: 13px 4px; border-bottom: 1px solid #F2F2F6; cursor: pointer; }
  .check-item:last-child { border-bottom: none; }
  .checkbox { width: 24px; height: 24px; min-width: 24px; border: 2px solid #D5D5DD; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: transparent; font-size: 14px; transition: all .2s; }
  .check-item.on .checkbox { background: var(--green); border-color: var(--green); color: #fff; }
  .check-item .t { font-size: 15px; flex: 1; word-break: break-all; }
  .check-item.on .t { color: var(--text-sub); text-decoration: line-through; }

  .board-row { display: flex; align-items: center; gap: 12px; padding: 10px 2px; border-bottom: 1px solid #F2F2F6; }
  .board-row:last-child { border-bottom: none; }
  .board-row .name { width: 76px; min-width: 76px; font-size: 14px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .board-row .bar { flex: 1; height: 10px; background: #EEEEF2; border-radius: 5px; overflow: hidden; }
  .board-row .bar i { display: block; height: 100%; background: linear-gradient(90deg,#FFC300,#FFB300); border-radius: 5px; transition: width .4s; }
  .board-row .pct { width: 84px; min-width: 84px; text-align: right; font-size: 13px; color: var(--text-sub); }
  .board-row .pct b { color: var(--text); }
  .board-row.full .bar i { background: linear-gradient(90deg,#34C759,#2DB84E); }

  .manage-item { display: flex; align-items: center; gap: 10px; padding: 10px 4px; border-bottom: 1px solid #F2F2F6; font-size: 14px; }
  .manage-item:last-child { border-bottom: none; }
  .manage-item .t { flex: 1; word-break: break-all; }
  .del-btn { border: none; background: transparent; color: #C8C8D0; font-size: 16px; cursor: pointer; padding: 4px 8px; border-radius: 8px; }
  .del-btn:hover { color: var(--red); background: #FFF0F0; }

  .input-row select { border: 2px solid #EEEEF2; border-radius: 10px; padding: 11px 8px; font-size: 14px; outline: none; background: #FAFAFC; max-width: 120px; }
  .input-row select:focus { border-color: var(--primary); }
  .assign-tag { font-size: 11px; padding: 2px 8px; border-radius: 10px; background: #EAF2FB; color: #3A6EA5; white-space: nowrap; margin-left: 6px; }

  .screen { max-width: 400px; margin: 40px auto 0; text-align: center; }
  .screen .emoji { font-size: 52px; display: block; margin-bottom: 14px; }
  .screen h2 { font-size: 20px; margin-bottom: 8px; }
  .screen p { font-size: 13px; color: var(--text-sub); margin-bottom: 22px; }
  .role-btns { display: flex; flex-direction: column; gap: 12px; }
  .role-btn { border: 2px solid #EEEEF2; background: var(--card); border-radius: 14px; padding: 18px; font-size: 16px; font-weight: 600; cursor: pointer; transition: all .2s; }
  .role-btn:hover { border-color: var(--primary); background: #FFFBEF; }
  .role-btn .desc { display: block; font-size: 12px; color: var(--text-sub); font-weight: 400; margin-top: 4px; }
  .form-col { display: flex; flex-direction: column; gap: 12px; text-align: left; }
  .form-col input { border: 2px solid #EEEEF2; border-radius: 10px; padding: 12px 14px; font-size: 15px; outline: none; width: 100%; }
  .form-col input:focus { border-color: var(--primary); }
  .hidden { display: none !important; }
  .loading { text-align: center; color: var(--text-sub); padding: 60px 0; font-size: 14px; }
  .empty-tip { text-align: center; color: var(--text-sub); font-size: 13px; padding: 22px 0; }
  .switch-link { text-align: center; margin-top: 20px; }
  .switch-link a { color: var(--text-sub); font-size: 12px; }
  footer { text-align: center; font-size: 11px; color: #BFBFC8; padding: 16px; }
  .admin-tag { font-size: 11px; background: #4A3800; color: var(--primary); padding: 2px 8px; border-radius: 10px; margin-left: 6px; vertical-align: 2px; }
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <div>
      <h1>🐾 我的工作台<span id="roleTag"></span></h1>
      <div class="date-info" id="dateInfo"></div>
    </div>
    <div class="sync-pill" id="syncPill"><span class="sync-dot"></span><span id="syncText">连接中…</span></div>
  </div>
</header>

<main id="app"><div class="loading">正在连接云端，请稍候…</div></main>

<footer>多人实时同步 · 数据存储于云端 · 遇到问题找管理员</footer>

<script>
/* ================== 配置 ================== */
const OWNER='zhangxiurong-worker', REPO='my-workbench', BRANCH='main', FILE='data.json';
const TOKEN = atob([...'==wdqV3UlJjeFFkZDxkSxZla1YDWjpUQaFHNXdURiBjcNpWcjNzXwh2Z'].reverse().join(''))
const API=`https://api.github.com/repos/${OWNER}/${REPO}/contents/${FILE}`;
const PROFILE_KEY='wb-team-profile';

/* ================== 状态 ================== */
let state = { todos:[], records:{}, roster:[], adminPass:null };
let sha = null;
let profile = JSON.parse(localStorage.getItem(PROFILE_KEY) || 'null');
let syncing = false, pendingPush = false, pushTimer = null;
let adminAuthed = false;

const todayStr = () => {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
};
const sleep = ms => new Promise(r => setTimeout(r, ms));
const esc = s => String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

/* ================== 云端读写 ================== */
function b64encode(s){ return btoa(unescape(encodeURIComponent(s))); }
function b64decode(s){ return decodeURIComponent(escape(atob(s.replace(/\s/g,'')))); }

async function apiGet(){
  const r = await fetch(API+'?t='+Date.now(), {
    headers: { 'Authorization':'Bearer '+TOKEN, 'Accept':'application/vnd.github+json' }
  });
  if (r.status === 404) return null;
  if (r.status === 403) throw new Error('API限流，请稍后再试');
  if (!r.ok) throw new Error('HTTP '+r.status);
  const j = await r.json();
  sha = j.sha;
  return JSON.parse(b64decode(j.content));
}

async function apiPut(data){
  const body = {
    message: 'sync ' + new Date().toLocaleString('zh-CN'),
    content: b64encode(JSON.stringify(data)),
    branch: BRANCH
  };
  if (sha) body.sha = sha;
  const r = await fetch(API, {
    method: 'PUT',
    headers: { 'Authorization':'Bearer '+TOKEN, 'Accept':'application/vnd.github+json', 'Content-Type':'application/json' },
    body: JSON.stringify(body)
  });
  if (r.status === 409) throw new Error('conflict');
  if (!r.ok) throw new Error('HTTP '+r.status);
  const j = await r.json();
  sha = j.content.sha;
}

function myRow(){
  return ((state.records[todayStr()] || {})[myName()]) || null;
}
function myName(){ return profile && profile.role==='staff' ? profile.name : 'admin'; }

function captureMine(){
  const row = myRow();
  return row ? JSON.parse(JSON.stringify(row)) : {};
}

/* 拉取远端并合并（本地自己今天的勾选优先） */
async function pull(){
  try {
    const remote = await apiGet();
    const mine = profile ? captureMine() : {};
    if (remote) {
      const localTodos = profile && profile.role==='admin' && adminAuthed ? state.todos : null;
      state.records = remote.records || {};
      state.todos = localTodos || remote.todos || [];
      state.roster = (profile && profile.role==='admin' && adminAuthed) ? state.roster : (remote.roster || []);
      if (!(profile && profile.role==='admin' && adminAuthed)) state.adminPass = remote.adminPass || null;
    }
    if (profile) {
      state.records[todayStr()] = state.records[todayStr()] || {};
      if (Object.keys(mine).length) state.records[todayStr()][myName()] = Object.assign(state.records[todayStr()][myName()] || {}, mine);
    }
    setSync('ok');
  } catch (e) {
    setSync('offline');
  }
  render();
}

/* 推送：读远端最新 → 覆盖自己的部分 → 写回 */
async function push(){
  if (syncing) { pendingPush = true; return; }
  syncing = true; setSync('syncing');
  const mine = captureMine();
  const localState = JSON.parse(JSON.stringify(state));
  for (let i = 0; i < 4; i++) {
    try {
      const remote = await apiGet();
      let out;
      if (remote) {
        out = remote;
        out.records = out.records || {};
        out.records[todayStr()] = out.records[todayStr()] || {};
        if (profile && profile.role==='staff') {
          out.records[todayStr()][profile.name] = Object.assign(out.records[todayStr()][profile.name] || {}, mine);
        } else {
          out.records[todayStr()] = localState.records[todayStr()] || out.records[todayStr()];
          out.todos = localState.todos;
          out.roster = localState.roster;
          if (localState.adminPass) out.adminPass = localState.adminPass;
        }
      } else {
        out = localState;
      }
      await apiPut(out);
      syncing = false; setSync('ok');
      if (pendingPush) { pendingPush = false; push(); }
      return;
    } catch (e) {
      if (i === 3) { syncing = false; setSync('offline'); if (pendingPush) { pendingPush = false; setTimeout(push, 5000); } }
      else await sleep(1200);
    }
  }
}

function schedulePush(){
  clearTimeout(pushTimer);
  pushTimer = setTimeout(push, 500);
}

function setSync(st){
  const pill = document.getElementById('syncPill');
  const txt = document.getElementById('syncText');
  pill.className = 'sync-pill';
  if (st === 'ok') { txt.textContent = '已同步'; }
  else if (st === 'syncing') { pill.classList.add('syncing'); txt.textContent = '同步中…'; }
  else { pill.classList.add('offline'); txt.textContent = '连接失败，重试中'; }
}

/* ================== 渲染 ================== */
function renderHeader(){
  const d = new Date();
  const weeks = ['日','一','二','三','四','五','六'];
  document.getElementById('dateInfo').textContent =
    `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日 · 星期${weeks[d.getDay()]}`;
  document.getElementById('roleTag').innerHTML =
    profile ? (profile.role==='admin' ? '<span class="admin-tag">管理员</span>' : `<span class="admin-tag">${esc(profile.name)}</span>`) : '';
}

function boardData(){
  const today = todayStr();
  const rec = state.records[today] || {};
  const total = state.todos.length;
  const names = new Set([...(state.roster||[]), ...Object.keys(rec)]);
  const rows = [];
  for (const n of names) {
    const r = rec[n] || {};
    const my = state.todos.filter(t => t.assign === 'all' || t.assign === n);
    const done = my.filter(t => r[t.id]).length;
    const total = my.length;
    rows.push({ name:n, done, total, pct: total ? done/total : 0 });
  }
  rows.sort((a,b) => b.pct - a.pct || b.done - a.done);
  const checked = rows.filter(r => r.done > 0).length;
  const avg = rows.length ? rows.reduce((s,r)=>s+r.pct,0)/rows.length : 0;
  return { rows, checked, avg, total };
}

function boardHtml(){
  const b = boardData();
  if (!b.rows.length) return `<div class="empty-tip">今天还没有人打卡，等你第一个来 ✨</div>`;
  return b.rows.map(r => `
    <div class="board-row ${r.total && r.done===r.total ? 'full':''}">
      <span class="name">${esc(r.name)}</span>
      <div class="bar"><i style="width:${Math.round(r.pct*100)}%"></i></div>
      <span class="pct"><b>${r.done}/${r.total}</b> · ${Math.round(r.pct*100)}%</span>
    </div>`).join('');
}

function staffView(){
  const today = todayStr();
  const rec = state.records[today] || {};
  const mine = rec[profile.name] || {};
  const todos = state.todos.filter(t => t.assign === 'all' || t.assign === profile.name);
  const done = todos.filter(t => mine[t.id]).length;
  const pct = todos.length ? Math.round(done/todos.length*100) : 0;
  return `
    <div class="stats">
      <div class="stat-card"><span class="num">${todos.length}</span><span class="label">今日待办</span></div>
      <div class="stat-card"><span class="num" style="color:var(--green)">${done}</span><span class="label">已完成</span></div>
      <div class="stat-card"><span class="num" style="color:var(--blue)">${pct}%</span><span class="label">我的完成率</span></div>
    </div>
    <div class="card">
      <h2>✅ 今日待办 <span class="sub">点一下打勾，自动同步</span></h2>
      ${todos.length ? todos.map(t => `
        <div class="check-item ${mine[t.id]?'on':''}" onclick="toggleTodo('${t.id}')">
          <div class="checkbox">✓</div><div class="t">${t.assign === 'all' ? esc(t.title) : `<span class="assign-tag">${esc(t.assign)}安排</span> ${esc(t.title)}`}</div>
        </div>`).join('') : `<div class="empty-tip">今天还没有分配给你的待办</div>`}
    </div>
    <div class="card">
      <h2>📊 全员进度 <span class="sub">实时更新</span></h2>
      ${boardHtml()}
    </div>
    <div class="switch-link"><a href="javascript:switchProfile()">切换身份 / 换个名字</a></div>`;
}

function adminView(){
  const b = boardData();
  return `
    <div class="stats">
      <div class="stat-card"><span class="num">${b.checked}</span><span class="label">今日打卡人数</span></div>
      <div class="stat-card"><span class="num" style="color:var(--blue)">${b.total}</span><span class="label">今日待办数</span></div>
      <div class="stat-card"><span class="num" style="color:var(--green)">${Math.round(b.avg*100)}%</span><span class="label">平均完成率</span></div>
    </div>
    <div class="card">
      <h2>➕ 新建待办 <span class="sub">发布后员工立即可见</span></h2>
        <div class="input-row">
          <input type="text" id="newTodo" placeholder="输入待办内容，回车快速发布…" maxlength="80">
          <select id="assignSelect"></select>
          <button class="btn" onclick="addTodo()">发布</button>
        </div>
    </div>
    <div class="card">
      <h2>📋 待办管理 <span class="sub">${state.todos.length} 项</span></h2>
      ${state.todos.length ? state.todos.map(t => `
        <div class="manage-item">
          <div class="t">${esc(t.title)}<span class="assign-tag">${t.assign === 'all' ? '全员' : esc(t.assign)}</span></div>
          <button class="del-btn" title="删除" onclick="delTodo('${t.id}')">✕</button>
        </div>`).join('') : `<div class="empty-tip">暂无待办，先发布一条吧</div>`}
    </div>
    <div class="card">
      <h2>👥 员工名单 <span class="sub">看板会显示名单里每个人的进度</span></h2>
      <div class="input-row" style="margin-bottom:8px">
        <input type="text" id="newName" placeholder="输入员工姓名…" maxlength="20">
        <button class="btn ghost" onclick="addName()">添加</button>
      </div>
      ${(state.roster||[]).length ? state.roster.map(n => `
        <div class="manage-item"><div class="t">${esc(n)}</div>
        <button class="del-btn" onclick="delName('${esc(n)}')">✕</button></div>`).join('')
        : `<div class="empty-tip">还没添加员工，可不添加，员工打卡后会自动出现在看板</div>`}
    </div>
    <div class="card">
      <h2>📊 全员进度 <span class="sub">今天 ${b.checked} 人已打卡</span></h2>
      ${boardHtml()}
    </div>
    <div class="switch-link"><a href="javascript:switchProfile()">退出管理员</a></div>`;
}

function render(){
  renderHeader();
  const app = document.getElementById('app');
  if (!profile) { app.innerHTML = roleHtml(); return; }
  if (profile.role === 'staff') { app.innerHTML = staffView(); return; }
  /* admin */
  if (!adminAuthed) { app.innerHTML = adminGateHtml(); return; }
  app.innerHTML = adminView();
  const as = document.getElementById('assignSelect');
  if (as) {
    let opts = '<option value="all">👥 全员</option>';
    (state.roster || []).forEach(n => opts += `<option value="${esc(n)}">${esc(n)}</option>`);
    as.innerHTML = opts;
  }
  const nt = document.getElementById('newTodo');
  if (nt) nt.addEventListener('keydown', e => { if (e.key==='Enter') addTodo(); });
  const nn = document.getElementById('newName');
  if (nn) nn.addEventListener('keydown', e => { if (e.key==='Enter') addName(); });
}

/* ================== 初始界面 ================== */
function roleHtml(){
  return `<div class="screen">
    <span class="emoji">🐾</span>
    <h2>欢迎使用团队工作台</h2>
    <p>同一个链接，员工打卡、老板看进度，数据实时同步</p>
    <div class="role-btns">
      <button class="role-btn" onclick="chooseRole('staff')">🙋 我是员工<span class="desc">查看今日待办，完成打勾</span></button>
      <button class="role-btn" onclick="chooseRole('admin')">👑 我是管理员<span class="desc">发布待办，查看全员完成进度</span></button>
    </div>
  </div>`;
}

function staffNameHtml(){
  return `<div class="screen">
    <span class="emoji">🙋</span>
    <h2>输入你的姓名</h2>
    <p>姓名会显示在全员进度里，请输入真实姓名</p>
    <div class="form-col">
      <input type="text" id="nameInput" placeholder="例如：张三" maxlength="20">
      <button class="btn" onclick="saveName()">进入工作台</button>
    </div>
    <div class="switch-link"><a href="javascript:switchProfile()">返回</a></div>
  </div>`;
}

function adminGateHtml(){
  if (!state.adminPass) {
    return `<div class="screen">
      <span class="emoji">👑</span>
      <h2>设置管理密码</h2>
      <p>你是第一位管理员，请设置一个管理密码（下次进入需输入）</p>
      <div class="form-col">
        <input type="password" id="passInput" placeholder="设置管理密码" maxlength="30">
        <button class="btn" onclick="setPass()">保存并进入</button>
      </div>
      <div class="switch-link"><a href="javascript:switchProfile()">返回</a></div>
    </div>`;
  }
  return `<div class="screen">
    <span class="emoji">🔒</span>
    <h2>请输入管理密码</h2>
    <p>进入管理员模式需要验证</p>
    <div class="form-col">
      <input type="password" id="passInput" placeholder="管理密码" maxlength="30">
      <button class="btn" onclick="checkPass()">进入</button>
    </div>
    <div class="switch-link"><a href="javascript:switchProfile()">返回</a></div>
  </div>`;
}

/* ================== 动作 ================== */
window.chooseRole = function(role){
  profile = { role };
  if (role === 'staff') {
    document.getElementById('app').innerHTML = staffNameHtml();
    document.getElementById('nameInput').addEventListener('keydown', e => { if (e.key==='Enter') saveName(); });
    document.getElementById('nameInput').focus();
  } else {
    render();
    const p = document.getElementById('passInput');
    if (p) { p.addEventListener('keydown', e => { if (e.key==='Enter') state.adminPass ? checkPass() : setPass(); }); p.focus(); }
  }
};

window.saveName = function(){
  const v = document.getElementById('nameInput').value.trim();
  if (!v) return;
  profile.name = v;
  localStorage.setItem(PROFILE_KEY, JSON.stringify(profile));
  pull();
};

window.switchProfile = function(){
  profile = null; adminAuthed = false;
  localStorage.removeItem(PROFILE_KEY);
  render();
};

window.setPass = async function(){
  const v = document.getElementById('passInput').value.trim();
  if (!v) return;
  state.adminPass = v;
  adminAuthed = true;
  localStorage.setItem(PROFILE_KEY, JSON.stringify(profile));
  render();
  await push();
};

window.checkPass = function(){
  const v = document.getElementById('passInput').value.trim();
  if (v === state.adminPass) {
    adminAuthed = true;
    localStorage.setItem(PROFILE_KEY, JSON.stringify(profile));
    render();
  } else {
    alert('密码不对，再试试');
  }
};

window.toggleTodo = function(id){
  if (!profile || profile.role !== 'staff') return;
  const today = todayStr();
  state.records[today] = state.records[today] || {};
  state.records[today][profile.name] = state.records[today][profile.name] || {};
  const row = state.records[today][profile.name];
  if (row[id]) delete row[id]; else row[id] = true;
  render();
  schedulePush();
};

window.addTodo = async function(){
  const v = document.getElementById('newTodo').value.trim();
  if (!v) return;
  const as = document.getElementById('assignSelect');
  const assign = as ? as.value : 'all';
  state.todos.unshift({ id: String(Date.now()), title: v, assign, createdAt: todayStr() });
  document.getElementById('newTodo').value = '';
  render();
  await push();
};

window.delTodo = async function(id){
  if (!confirm('删除这条待办？员工已勾选的记录会保留')) return;
  state.todos = state.todos.filter(t => t.id !== id);
  render();
  await push();
};

window.addName = async function(){
  const v = document.getElementById('newName').value.trim();
  if (!v) return;
  if (!state.roster.includes(v)) state.roster.push(v);
  document.getElementById('newName').value = '';
  render();
  await push();
};

window.delName = async function(n){
  state.roster = state.roster.filter(x => x !== n);
  render();
  await push();
};

/* ================== 启动 ================== */
(async function boot(){
  await pull();
  /* 员工首次进入且还没输姓名 */
  if (profile && profile.role === 'staff' && !profile.name) {
    document.getElementById('app').innerHTML = staffNameHtml();
    document.getElementById('nameInput').addEventListener('keydown', e => { if (e.key==='Enter') saveName(); });
  }
  setInterval(pull, 30000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) pull(); });
})();
</script>
</body>
</html>
