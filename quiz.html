<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>门店每周考题</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --primary: #FFC300; --primary-dark: #E6AF00;
    --bg: #F5F6FA; --card: #FFFFFF;
    --text: #2B2B33; --text-sub: #8A8A96;
    --red: #FF5A5F; --green: #34C759; --blue: #4A90D9;
    --shadow: 0 2px 12px rgba(0,0,0,0.06);
  }
  body { font-family: "PingFang SC","Microsoft YaHei",-apple-system,sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

  header { background: linear-gradient(135deg,#FFC300 0%,#FFD75E 100%); padding: 24px 20px; color: #4A3800; }
  .header-inner { max-width: 680px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
  header h1 { font-size: 22px; letter-spacing: 1px; }
  .date-info { font-size: 13px; opacity: 0.85; margin-top: 4px; }
  .sync-pill { font-size: 12px; background: rgba(255,255,255,0.5); padding: 6px 14px; border-radius: 16px; display: flex; align-items: center; gap: 6px; white-space: nowrap; }
  .sync-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); }
  .sync-pill.syncing .sync-dot { background: var(--primary-dark); animation: blink 1s infinite; }
  .sync-pill.offline .sync-dot { background: var(--red); }
  @keyframes blink { 50% { opacity: 0.3; } }

  main { max-width: 680px; margin: 0 auto; padding: 18px 16px 60px; }

  .card { background: var(--card); border-radius: 14px; padding: 18px; box-shadow: var(--shadow); margin-bottom: 16px; }
  .card h2 { font-size: 16px; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .card h2 .sub { font-size: 12px; color: var(--text-sub); font-weight: 400; }

  .btn { background: var(--primary); color: #4A3800; border: none; border-radius: 10px; padding: 11px 22px; font-size: 15px; font-weight: 600; cursor: pointer; }
  .btn:active { background: var(--primary-dark); }
  .btn.ghost { background: #FFF3CC; }
  .btn.small { padding: 7px 14px; font-size: 13px; }
  .btn.danger { background: #FFECEC; color: #C0392B; }
  .btn.block { width: 100%; margin-top: 6px; }
  .btn:disabled { opacity: 0.5; }

  .screen { max-width: 400px; margin: 40px auto 0; text-align: center; }
  .screen .emoji { font-size: 52px; display: block; margin-bottom: 14px; }
  .screen h2 { font-size: 20px; margin-bottom: 8px; }
  .screen p { font-size: 13px; color: var(--text-sub); margin-bottom: 22px; }
  .role-btns { display: flex; flex-direction: column; gap: 12px; }
  .role-btn { border: 2px solid #EEEEF2; background: var(--card); border-radius: 14px; padding: 18px; font-size: 16px; font-weight: 600; cursor: pointer; transition: all .2s; font-family: inherit; }
  .role-btn:hover { border-color: var(--primary); background: #FFFBEF; }
  .role-btn .desc { display: block; font-size: 12px; color: var(--text-sub); font-weight: 400; margin-top: 4px; }
  .form-col { display: flex; flex-direction: column; gap: 12px; text-align: left; }
  .form-col input, .form-col textarea, .form-col select { border: 2px solid #EEEEF2; border-radius: 10px; padding: 12px 14px; font-size: 15px; outline: none; width: 100%; font-family: inherit; }
  .form-col textarea { resize: vertical; min-height: 44px; }
  .form-col input:focus, .form-col textarea:focus, .form-col select:focus { border-color: var(--primary); }

  .hidden { display: none !important; }
  .loading { text-align: center; color: var(--text-sub); padding: 60px 0; font-size: 14px; }
  .empty-tip { text-align: center; color: var(--text-sub); font-size: 13px; padding: 22px 0; }
  .msg-tip { font-size: 13px; padding: 10px 12px; border-radius: 10px; margin-bottom: 10px; display: none; }
  .msg-tip.err { background: #FFECEC; color: #C0392B; display: block; }
  .msg-tip.ok { background: #E8F5E9; color: #2E7D32; display: block; }

  .quiz-item { display: flex; align-items: center; gap: 12px; padding: 14px 4px; border-bottom: 1px solid #F2F2F6; cursor: pointer; }
  .quiz-item:last-child { border-bottom: none; }
  .quiz-item .t { flex: 1; }
  .quiz-item .t .title { font-size: 15px; font-weight: 600; word-break: break-all; }
  .quiz-item .t .meta { font-size: 12px; color: var(--text-sub); margin-top: 3px; }
  .tag { font-size: 11px; padding: 3px 10px; border-radius: 10px; white-space: nowrap; }
  .tag.todo { background: #EAF2FB; color: #3A6EA5; }
  .tag.done { background: #E8F5E9; color: #2E7D32; }
  .tag.draft { background: #F0F0F4; color: #8A8A96; }
  .tag.pub { background: #FFF3CC; color: #9C7400; }

  .q-card { background: var(--card); border-radius: 14px; padding: 16px; box-shadow: var(--shadow); margin-bottom: 14px; }
  .q-num { font-size: 13px; color: var(--text-sub); margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
  .q-text { font-size: 16px; font-weight: 600; line-height: 1.5; margin-bottom: 12px; word-break: break-all; }
  .opt { display: flex; align-items: center; gap: 12px; padding: 12px 12px; border: 2px solid #EEEEF2; border-radius: 10px; margin-bottom: 10px; cursor: pointer; transition: all .15s; }
  .opt:last-child { margin-bottom: 0; }
  .opt .dot { width: 22px; height: 22px; min-width: 22px; border: 2px solid #D5D5DD; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: transparent; font-size: 12px; }
  .opt.on { border-color: var(--primary); background: #FFFBEF; }
  .opt.on .dot { background: var(--primary); border-color: var(--primary); color: #4A3800; }
  .opt .otxt { font-size: 15px; word-break: break-all; }
  .opt.judge big { font-size: 20px; }
  .opt.right { border-color: var(--green); background: #E8F5E9; }
  .opt.right .dot { background: var(--green); border-color: var(--green); color: #fff; }
  .opt.wrong { border-color: var(--red); background: #FFECEC; }
  .opt.wrong .dot { background: var(--red); border-color: var(--red); color: #fff; }

  .opt-edit { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .opt-edit input { flex: 1; border: 2px solid #EEEEF2; border-radius: 10px; padding: 10px 12px; font-size: 14px; outline: none; }
  .opt-edit input:focus { border-color: var(--primary); }
  .opt-edit .mark { font-size: 11px; padding: 4px 8px; border-radius: 8px; border: 2px solid #EEEEF2; background: #FAFAFC; cursor: pointer; color: var(--text-sub); white-space: nowrap; }
  .opt-edit .mark.on { background: var(--green); border-color: var(--green); color: #fff; }
  .opt-edit .rm { border: none; background: transparent; color: #C8C8D0; font-size: 16px; cursor: pointer; padding: 4px 6px; }
  .edit-q { border: 2px solid #F0F0F4; border-radius: 12px; padding: 14px; margin-bottom: 12px; }
  .edit-q .row { display: flex; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
  .edit-q textarea { border: 2px solid #EEEEF2; border-radius: 10px; padding: 10px 12px; font-size: 15px; outline: none; width: 100%; font-family: inherit; resize: vertical; }
  .edit-q textarea:focus { border-color: var(--primary); }

  .result-hero { text-align: center; padding: 30px 0 10px; }
  .result-hero .score { font-size: 52px; font-weight: 800; color: var(--primary-dark); }
  .result-hero .full { font-size: 18px; color: var(--text-sub); }
  .result-hero .tip { font-size: 13px; color: var(--text-sub); margin-top: 10px; }

  .score-row { display: flex; align-items: center; gap: 12px; padding: 12px 2px; border-bottom: 1px solid #F2F2F6; cursor: pointer; }
  .score-row:last-child { border-bottom: none; }
  .score-row .name { flex: 1; font-size: 15px; font-weight: 600; }
  .score-row .sc { font-size: 15px; font-weight: 700; }
  .score-row .tm { font-size: 11px; color: var(--text-sub); }
  .score-row .sc.pass { color: var(--green); }
  .score-row .sc.fail { color: var(--red); }

  .tab-row { display: flex; gap: 8px; margin-bottom: 16px; }
  .tab-row .tab { flex: 1; text-align: center; font-size: 14px; font-weight: 600; padding: 10px 0; border: 2px solid #EEEEF2; border-radius: 10px; cursor: pointer; background: var(--card); }
  .tab-row .tab.on { border-color: var(--primary); background: #FFFBEF; }

  .switch-link { text-align: center; margin-top: 20px; }
  .switch-link a { color: var(--text-sub); font-size: 12px; cursor: pointer; text-decoration: underline; }
  footer { text-align: center; font-size: 11px; color: #BFBFC8; padding: 16px; }
  .admin-tag { font-size: 11px; background: #4A3800; color: var(--primary); padding: 2px 8px; border-radius: 10px; margin-left: 6px; vertical-align: 2px; }
  .manage-item { display: flex; align-items: center; gap: 10px; padding: 12px 4px; border-bottom: 1px solid #F2F2F6; font-size: 14px; flex-wrap: wrap; }
  .manage-item:last-child { border-bottom: none; }
  .manage-item .t { flex: 1; min-width: 120px; word-break: break-all; }
  .manage-item .t .meta { font-size: 12px; color: var(--text-sub); margin-top: 2px; }
  .del-btn { border: none; background: transparent; color: #C8C8D0; font-size: 16px; cursor: pointer; padding: 4px 8px; border-radius: 8px; }
  .del-btn:hover { color: var(--red); background: #FFF0F0; }
  .back-bar { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
  .back-bar a { color: var(--text-sub); font-size: 14px; cursor: pointer; text-decoration: none; }
  .back-bar b { font-size: 15px; }
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <div>
      <h1>📝 每周考题<span id="roleTag"></span></h1>
      <div class="date-info" id="dateInfo"></div>
    </div>
    <div class="sync-pill" id="syncPill"><span class="sync-dot"></span><span id="syncText">连接中…</span></div>
  </div>
</header>

<main id="app"><div class="loading">正在连接云端，请稍候…</div></main>

<footer>老板出题 · 员工作答 · 数据实时同步</footer>

<script>
/* ================== 配置 ================== */
const OWNER='zhangxiurong-worker', REPO='my-workbench', BRANCH='main', FILE='quiz-data.json';
const TOKEN = atob([...'==wdqV3UlJjeFFkZDxkSxZla1YDWjpUQaFHNXdURiBjcNpWcjNzXwh2Z'].reverse().join(''))
const API=`https://api.github.com/repos/${OWNER}/${REPO}/contents/${FILE}`;
const PROFILE_KEY='quiz-profile';
const PASS_SALT='quiz-salt-2026:';

/* ================== 状态 ================== */
let state = { quizzes: [], submissions: {}, adminPass: null };
let sha = null;
let profile = JSON.parse(localStorage.getItem(PROFILE_KEY) || 'null');
let syncing = false;
let view = 'role';          /* role | staffLogin | staffHome | answering | result | adminLogin | adminHome | editor | manage | board | boardQuiz | passChange */
let currentQuizId = null;
let ansDraft = {};          /* 答题中 {qIdx: 选项下标} */
let lastResult = null;      /* {score,total} */
let editDraft = null;       /* 出题草稿 */
let boardQuizId = null;
let viewMsg = '';           /* 页面级提示 err:xxx / ok:xxx */
let submittingFlag = false;

const sleep = ms => new Promise(r => setTimeout(r, ms));
const esc = s => String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

function nowStr(){ const d=new Date(); return d.toLocaleString('zh-CN',{hour12:false}); }
function dateOnly(iso){ return iso ? String(iso).slice(0,10) : ''; }

function setSync(s){
  const pill=document.getElementById('syncPill'), txt=document.getElementById('syncText');
  if(!pill) return;
  pill.className='sync-pill'+(s==='syncing'?' syncing':s==='offline'?' offline':'');
  txt.textContent = s==='syncing'?'同步中…':s==='offline'?'连接失败，点此处重试':'已连接云端';
}
function fmtScore(r){ return r.score + '/' + r.total; }

/* ================== 云端读写 ================== */
function b64encode(s){ return btoa(unescape(encodeURIComponent(s))); }
function b64decode(s){ return decodeURIComponent(escape(atob(s.replace(/\s/g,'')))); }

async function hashPass(p){
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(PASS_SALT + p));
  return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2,'0')).join('');
}

async function apiGet(){
  const r = await fetch(API+'?t='+Date.now(), {
    headers: { 'Authorization':'Bearer '+TOKEN, 'Accept':'application/vnd.github+json' }
  });
  if (r.status === 404) { sha = null; return null; }
  if (r.status === 403) throw new Error('API限流，请稍后再试');
  if (!r.ok) throw new Error('HTTP '+r.status);
  const j = await r.json();
  sha = j.sha;
  return JSON.parse(b64decode(j.content));
}

async function apiPut(data, msg){
  const body = {
    message: (msg || 'sync') + ' ' + new Date().toLocaleString('zh-CN'),
    content: b64encode(JSON.stringify(data)),
    branch: BRANCH
  };
  if (sha) body.sha = sha;
  const r = await fetch(API, {
    method: 'PUT',
    headers: { 'Authorization':'Bearer '+TOKEN, 'Accept':'application/vnd.github+json', 'Content-Type':'application/json' },
    body: JSON.stringify(body)
  });
  if (r.status === 409) throw new Error('conflict');
  if (!r.ok) throw new Error('HTTP '+r.status);
  const j = await r.json();
  sha = j.content.sha;
}

/* 注册后统一入口：拉云端最新 → 应用本端变更 → 写回（带冲突重试） */
async function mergePush(applyFn, msg){
  if (syncing) return false;
  syncing = true; setSync('syncing');
  let ok = false;
  for (let i = 0; i < 4; i++) {
    try {
      let remote = await apiGet();
      if (!remote) remote = { quizzes: [], submissions: {}, adminPass: null };
      remote.quizzes = remote.quizzes || [];
      remote.submissions = remote.submissions || {};
      applyFn(remote);
      await apiPut(remote, msg);
      ok = true; break;
    } catch(e) {
      if (e.message !== 'conflict') break;
      await sleep(500 + i*500);
    }
  }
  syncing = false; setSync(ok?'ok':'offline');
  if (ok) { await pull(); } else { viewMsg='err:同步失败，网络拥挤，请稍后重试'; render(); }
  return ok;
}

/* ================== 拉取 ================== */
async function pull(){
  try {
    const remote = await apiGet();
    if (remote) {
      state.quizzes = remote.quizzes || [];
      state.submissions = remote.submissions || {};
      state.adminPass = remote.adminPass || null;
    }
    setSync('ok');
  } catch(e) {
    setSync('offline');
  }
  /* 管理员编辑界面 / 答题界面不重绘，避免打断 */
  if (view !== 'editor' && view !== 'answering') render();
}

/* ================== 工具 ================== */
function getQuiz(id){ return state.quizzes.find(q => q.id === id); }
function getSub(quizId, name){ return (state.submissions[quizId]||{})[name] || null; }
function publishedQuizzes(){ return state.quizzes.filter(q => q.published).sort((a,b) => (b.createdAt||'').localeCompare(a.createdAt||'')); }
function uid(){ return 'q' + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function setMsg(m){ viewMsg = m; render(); window.scrollTo(0,0); }

/* ================== 交互入口（员工） ================== */
window.chooseRole = function(role){
  viewMsg = '';
  if (role === 'staff') {
    if (profile && profile.role === 'staff') { view = 'staffHome'; }
    else view = 'staffLogin';
  } else {
    if (profile && profile.role === 'admin') { view = 'adminHome'; }
    else view = 'adminLogin';
  }
  render();
};

window.staffLoginGo = async function(){
  const name = (document.getElementById('staffName').value || '').trim();
  if (!name) { setMsg('err:请输入你的姓名'); return; }
  if (name.length > 12) { setMsg('err:姓名太长了，请输入真实姓名'); return; }
  /* 预留：老板姓名不算成绩 */
  profile = { role: 'staff', name };
  localStorage.setItem(PROFILE_KEY, JSON.stringify(profile));
  viewMsg = ''; view = 'staffHome';
  render();
};

window.staffLogout = function(){
  profile = null;
  localStorage.removeItem(PROFILE_KEY);
  view = 'role'; viewMsg = '';
  render();
};

window.openQuiz = async function(quizId){
  await pull();
  const q = getQuiz(quizId);
  if (!q || !q.published) { setMsg('err:考题不存在或未发布'); return; }
  const sub = getSub(quizId, profile.name);
  if (sub) { setMsg('err:你已经答过这套题啦，不能重复作答'); return; }
  currentQuizId = quizId; ansDraft = {}; viewMsg = '';
  view = 'answering';
  render();
};

window.pickOpt = function(qi, oi){
  ansDraft[qi] = oi;
  render();
};

window.submitQuiz = async function(){
  const q = getQuiz(currentQuizId);
  if (!q) return;
  const total = q.questions.length;
  for (let i = 0; i < total; i++) {
    if (ansDraft[i] === undefined) { setMsg('err:还有第 ' + (i+1) + ' 题没作答，请全部答完再交卷'); return; }
  }
  if (submittingFlag) return;
  submittingFlag = true; setSync('syncing');
  let score = 0;
  const answers = [];
  for (let i = 0; i < total; i++) {
    const a = ansDraft[i];
    answers.push(a);
    if (q.questions[i].answer === a) score++;
  }
  const record = { score, total, answers, submittedAt: nowStr() };
  const ok = await mergePush(remote => {
    remote.submissions[currentQuizId] = remote.submissions[currentQuizId] || {};
    /* 远端已有人用同名交卷则以先者为准（防重复） */
    if (!remote.submissions[currentQuizId][profile.name]) {
      remote.submissions[currentQuizId][profile.name] = record;
    } else {
      record.score = remote.submissions[currentQuizId][profile.name].score;
      record.total = remote.submissions[currentQuizId][profile.name].total;
    }
  }, '员工交卷');
  submittingFlag = false;
  if (ok) { lastResult = record; view = 'result'; viewMsg = ''; render(); window.scrollTo(0,0); }
};

/* ================== 交互入口（老板） ================== */
window.adminLoginGo = async function(){
  const pass = document.getElementById('adminPass').value || '';
  if (!pass) { setMsg('err:请输入管理密码'); return; }
  const h = await hashPass(pass);
  if (state.adminPass && state.adminPass !== h) { setMsg('err:密码不正确'); return; }
  if (!state.adminPass) {
    /* 首次使用：初始密码 888888，登录时自动写入云端 */
    if (pass !== '888888') { setMsg('err:密码不正确（初始密码 888888）'); return; }
    const hh = h;
    await mergePush(remote => { remote.adminPass = hh; }, '初始化管理密码');
  }
  profile = { role: 'admin' };
  localStorage.setItem(PROFILE_KEY, JSON.stringify(profile));
  view = 'adminHome'; viewMsg = '';
  render();
};

window.adminLogout = function(){
  profile = null;
  localStorage.removeItem(PROFILE_KEY);
  view = 'role'; viewMsg = '';
  render();
};

window.adminNav = function(tab){
  viewMsg = '';
  if (tab === 'editor') {
    editDraft = { title: '', questions: [ newEmptyQ() ] };
    view = 'editor';
  } else if (tab === 'manage') { view = 'manage'; }
  else if (tab === 'board') { view = 'board'; }
  else if (tab === 'pass') { view = 'passChange'; }
  else view = 'adminHome';
  render();
};

function newEmptyQ(){ return { type: 'single', text: '', options: ['','','',''], answer: 0 }; }

window.draftTitle = function(v){ editDraft.title = v; };
window.draftQText = function(i, v){ editDraft.questions[i].text = v; };
window.draftType = function(i, t){
  const q = editDraft.questions[i];
  q.type = t;
  if (t === 'judge') { q.options = ['对','错']; q.answer = 0; }
  else { q.options = ['','','','']; q.answer = 0; }
  render();
};
window.draftOpt = function(i, oi, v){ editDraft.questions[i].options[oi] = v; };
window.draftAnswer = function(i, oi){ editDraft.questions[i].answer = oi; render(); };
window.addOption = function(i){
  const q = editDraft.questions[i];
  if (q.options.length >= 6) { setMsg('err:最多 6 个选项'); return; }
  q.options.push('');
  render();
};
window.rmOption = function(i, oi){
  const q = editDraft.questions[i];
  if (q.options.length <= 2) { setMsg('err:至少保留 2 个选项'); return; }
  q.options.splice(oi, 1);
  if (q.answer >= q.options.length) q.answer = 0;
  render();
};
window.addQuestion = function(){
  editDraft.questions.push(newEmptyQ());
  render();
};
window.rmQuestion = function(i){
  if (editDraft.questions.length <= 1) { setMsg('err:至少保留 1 道题'); return; }
  editDraft.questions.splice(i, 1);
  render();
};
window.moveQ = function(i, dir){
  const arr = editDraft.questions, j = i + dir;
  if (j < 0 || j >= arr.length) return;
  [arr[i], arr[j]] = [arr[j], arr[i]];
  render();
};

function validateDraft(){
  const t = editDraft.title.trim();
  if (!t) return '请填写考题标题';
  for (let i = 0; i < editDraft.questions.length; i++) {
    const q = editDraft.questions[i];
    if (!q.text.trim()) return '第 ' + (i+1) + ' 题还没写题目内容';
    if (q.type === 'single') {
      for (let j = 0; j < q.options.length; j++) {
        if (!q.options[j].trim()) return '第 ' + (i+1) + ' 题的第 ' + (j+1) + ' 个选项是空的';
      }
    }
  }
  return null;
}

window.saveQuiz = async function(publish){
  const err = validateDraft();
  if (err) { setMsg('err:' + err); return; }
  const quiz = {
    id: uid(),
    title: editDraft.title.trim(),
    published: !!publish,
    createdAt: new Date().toISOString().slice(0,19),
    questions: editDraft.questions.map(q => ({
      type: q.type,
      text: q.text.trim(),
      options: q.type === 'judge' ? ['对','错'] : q.options.map(o => o.trim()),
      answer: Number(q.answer)
    }))
  };
  const ok = await mergePush(remote => { remote.quizzes.push(quiz); }, '老板新建考题');
  if (ok) {
    view = 'manage'; viewMsg = publish ? 'ok:考题已发布，员工现在就能看到' : 'ok:考题已存为草稿';
    render(); window.scrollTo(0,0);
  }
};

window.togglePublish = async function(quizId, pub){
  const ok = await mergePush(remote => {
    const q = remote.quizzes.find(x => x.id === quizId);
    if (q) q.published = pub;
  }, pub ? '发布考题' : '下线考题');
  if (ok) { viewMsg = pub ? 'ok:已发布' : 'ok:已下线（员工看不到，已有成绩保留）'; render(); window.scrollTo(0,0); }
};

window.rmQuiz = async function(quizId){
  if (!confirm('确定删除这套考题？对应成绩也会一起删除，操作不可恢复！')) return;
  const ok = await mergePush(remote => {
    remote.quizzes = remote.quizzes.filter(x => x.id !== quizId);
    delete remote.submissions[quizId];
  }, '删除考题');
  if (ok) { viewMsg = 'ok:已删除'; render(); window.scrollTo(0,0); }
};

window.openBoard = function(quizId){
  boardQuizId = quizId; view = 'boardQuiz'; viewMsg = '';
  render();
};

window.changePassGo = async function(){
  const p1 = document.getElementById('np1').value || '';
  const p2 = document.getElementById('np2').value || '';
  if (p1.length < 4) { setMsg('err:新密码至少 4 位'); return; }
  if (p1 !== p2) { setMsg('err:两次输入不一致'); return; }
  const h = await hashPass(p1);
  const ok = await mergePush(remote => { remote.adminPass = h; }, '修改管理密码');
  if (ok) { view = 'adminHome'; viewMsg = 'ok:管理密码已修改'; render(); window.scrollTo(0,0); }
};

/* ================== 渲染 ================== */
function render(){
  const app = document.getElementById('app');
  document.getElementById('dateInfo').textContent = new Date().toLocaleDateString('zh-CN',{month:'long',day:'numeric',weekday:'long'});
  const roleTag = document.getElementById('roleTag');
  roleTag.innerHTML = profile && profile.role==='admin' ? '<span class="admin-tag">老板</span>' : '';
  document.getElementById('syncText').onclick = pull;
  let html = '';
  if (view === 'role') html = viewRole();
  else if (view === 'staffLogin') html = viewStaffLogin();
  else if (view === 'staffHome') html = viewStaffHome();
  else if (view === 'answering') html = viewAnswering();
  else if (view === 'result') html = viewResult();
  else if (view === 'adminLogin') html = viewAdminLogin();
  else if (view === 'adminHome') html = viewAdminHome();
  else if (view === 'editor') html = viewEditor();
  else if (view === 'manage') html = viewManage();
  else if (view === 'board') html = viewBoard();
  else if (view === 'boardQuiz') html = viewBoardQuiz();
  else if (view === 'passChange') html = viewPassChange();
  app.innerHTML = html;
}

function msgHtml(){
  if (!viewMsg) return '';
  const cls = viewMsg.startsWith('err:') ? 'err' : 'ok';
  return '<div class="msg-tip ' + cls + '">' + esc(viewMsg.slice(4)) + '</div>';
}

function viewRole(){
  return `<div class="screen">
    <span class="emoji">📝</span>
    <h2>门店每周考题</h2>
    <p>老板出题，员工作答，成绩自动统计</p>
    <div class="role-btns">
      <button class="role-btn" onclick="chooseRole('staff')">✍️ 我要答题<span class="desc">员工点击这里进入</span></button>
      <button class="role-btn" onclick="chooseRole('admin')">👑 老板入口<span class="desc">出题 / 查看成绩</span></button>
    </div>
  </div>`;
}

function viewStaffLogin(){
  return `<div class="screen" style="max-width:340px">
    <span class="emoji">✍️</span>
    <h2>员工答题</h2>
    <p>请输入你的真实姓名，交卷后立即显示分数</p>
    ${msgHtml()}
    <div class="form-col">
      <input id="staffName" placeholder="你的姓名" maxlength="12" value="${profile&&profile.role==='staff'?esc(profile.name):''}">
      <button class="btn block" onclick="staffLoginGo()">进入</button>
    </div>
    <div class="switch-link"><a onclick="staffLogout()">← 返回上一层</a></div>
  </div>`;
}

function viewStaffHome(){
  const name = profile.name;
  const qs = publishedQuizzes();
  let list = '';
  if (!qs.length) list = '<div class="empty-tip">老板还没有发布考题，敬请期待～</div>';
  else list = qs.map(q => {
    const sub = getSub(q.id, name);
    const tag = sub
      ? `<span class="tag done">已完成 ${fmtScore(sub)}</span>`
      : '<span class="tag todo">未作答 →</span>';
    return `<div class="quiz-item" onclick="openQuiz('${q.id}')">
      <div class="t">
        <div class="title">${esc(q.title)}</div>
        <div class="meta">共 ${q.questions.length} 题 · ${dateOnly(q.createdAt)}</div>
      </div>${tag}
    </div>`;
  }).join('');
  return `<div class="card">
    <h2>你好，${esc(name)} <span class="sub" style="margin-left:auto"><a onclick="staffLogout()" style="cursor:pointer">退出</a></span></h2>
    ${msgHtml()}
  </div>
  <div class="card">
    <h2>📋 考题列表</h2>
    ${list}
  </div>`;
}

function viewAnswering(){
  const q = getQuiz(currentQuizId);
  if (!q) { view = 'staffHome'; return viewStaffHome(); }
  const total = q.questions.length;
  const answeredCount = Object.keys(ansDraft).length;
  const qHtml = q.questions.map((qq, i) => {
    const typeLabel = qq.type === 'judge' ? '判断题' : '单选题';
    const opts = qq.options.map((o, oi) => {
      const on = ansDraft[i] === oi;
      return `<div class="opt ${on?'on':''} ${qq.type==='judge'?'judge':''}" onclick="pickOpt(${i},${oi})">
        <span class="dot">${qq.type==='judge' ? '' : '✓'}</span><span class="otxt">${qq.type==='judge' ? '<big>'+esc(o)+'</big>' : esc(o)}</span>
      </div>`;
    }).join('');
    return `<div class="q-card">
      <div class="q-num"><span>第 ${i+1} 题 / 共 ${total} 题 · ${typeLabel}</span>${ansDraft[i]!==undefined?'<span class="tag done">已作答</span>':''}</div>
      <div class="q-text">${esc(qq.text)}</div>
      ${opts}
    </div>`;
  }).join('');
  return `<div class="card">
    <h2>${esc(q.title)}<span class="sub">已答 ${answeredCount}/${total}</span></h2>
    ${msgHtml()}
  </div>
  ${qHtml}
  <button class="btn block" onclick="submitQuiz()">交卷（答完 ${total} 题后点击）</button>
  <div style="height:20px"></div>`;
}

function viewResult(){
  const r = lastResult || { score:0, total:0 };
  const pct = r.total ? Math.round(r.score/r.total*100) : 0;
  const comment = pct >= 90 ? '太棒了，继续保持！' : pct >= 60 ? '不错，再接再厉！' : '再复习一下相关知识吧～';
  return `<div class="screen">
    <span class="emoji">${pct>=60?'🎉':'💪'}</span>
    <div class="result-hero">
      <div><span class="score">${r.score}</span><span class="full"> / ${r.total} 题</span></div>
      <div class="tip">正确率 ${pct}% · ${comment}</div>
      <div class="tip">详细答案只对老板可见</div>
    </div>
    <div class="role-btns" style="margin-top:24px">
      <button class="role-btn" onclick="chooseRole('staff')">返回考题列表</button>
    </div>
  </div>`;
}

function viewAdminLogin(){
  return `<div class="screen" style="max-width:340px">
    <span class="emoji">👑</span>
    <h2>老板入口</h2>
    <p>初始密码 888888，登录后请尽快修改</p>
    ${msgHtml()}
    <div class="form-col">
      <input id="adminPass" type="password" placeholder="管理密码">
      <button class="btn block" onclick="adminLoginGo()">登录</button>
    </div>
    <div class="switch-link"><a onclick="staffLogout()">← 返回上一层</a></div>
  </div>`;
}

function viewAdminHome(){
  const pubCount = publishedQuizzes().length;
  const totalSub = Object.values(state.submissions).reduce((n,s) => n + Object.keys(s||{}).length, 0);
  let avg = '—';
  const allScores = [];
  Object.values(state.submissions).forEach(s => Object.values(s||{}).forEach(r => allScores.push(r.total ? r.score/r.total : 0)));
  if (allScores.length) avg = Math.round(allScores.reduce((a,b)=>a+b,0)/allScores.length*100) + '%';
  return `${msgHtml()}
  <div class="card">
    <h2>老板工作台</h2>
    <div class="stats-row" style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px;">
      <div style="text-align:center"><div style="font-size:24px;font-weight:700">${pubCount}</div><div style="font-size:12px;color:var(--text-sub)">已发布考题</div></div>
      <div style="text-align:center"><div style="font-size:24px;font-weight:700">${totalSub}</div><div style="font-size:12px;color:var(--text-sub)">累计答题人次</div></div>
      <div style="text-align:center"><div style="font-size:24px;font-weight:700">${avg}</div><div style="font-size:12px;color:var(--text-sub)">平均正确率</div></div>
    </div>
  </div>
  <div class="card">
    <h2>常用操作</h2>
    <div class="role-btns" style="margin-top:4px">
      <button class="role-btn" onclick="adminNav('editor')">➕ 出一套新考题<span class="desc">单选题 + 判断题</span></button>
      <button class="role-btn" onclick="adminNav('manage')">📚 管理考题<span class="desc">发布 / 下线 / 删除</span></button>
      <button class="role-btn" onclick="adminNav('board')">📊 成绩看板<span class="desc">谁答了多少分、答题详情</span></button>
      <button class="role-btn" onclick="adminNav('pass')">🔒 修改管理密码</button>
      <button class="role-btn" onclick="adminLogout()">🚪 退出老板账号</button>
    </div>
  </div>`;
}

function viewEditor(){
  const d = editDraft;
  const qs = d.questions.map((q, i) => {
    const typeSel = `<div class="row">
      <select onchange="draftType(${i},this.value)" style="border:2px solid #EEEEF2;border-radius:10px;padding:8px 10px;font-size:13px;font-family:inherit">
        <option value="single" ${q.type==='single'?'selected':''}>单选题</option>
        <option value="judge" ${q.type==='judge'?'selected':''}>判断题</option>
      </select>
      <span style="flex:1"></span>
      <button class="btn small ghost" onclick="moveQ(${i},1)" ${i===d.questions.length-1?'disabled':''}>↓</button>
      <button class="btn small ghost" onclick="moveQ(${i},-1)" ${i===0?'disabled':''}>↑</button>
      <button class="btn small danger" onclick="rmQuestion(${i})">删题</button>
    </div>`;
    let optHtml = '';
    if (q.type === 'judge') {
      optHtml = `<div class="row" style="gap:8px">
        <span class="mark ${q.answer===0?'on':''}" style="cursor:pointer;padding:6px 14px;font-size:13px" onclick="draftAnswer(${i},0)">${q.answer===0?'✓ ':''}正确答案：对</span>
        <span class="mark ${q.answer===1?'on':''}" style="cursor:pointer;padding:6px 14px;font-size:13px" onclick="draftAnswer(${i},1)">${q.answer===1?'✓ ':''}正确答案：错</span>
      </div>`;
    } else {
      optHtml = q.options.map((o, oi) => `<div class="opt-edit">
        <span class="mark ${q.answer===oi?'on':''}" onclick="draftAnswer(${i},${oi})" title="设为正确答案">${q.answer===oi?'✓ 正确':'正确'}</span>
        <input placeholder="选项 ${oi+1}" value="${esc(o)}" oninput="draftOpt(${i},${oi},this.value)">
        <button class="rm" onclick="rmOption(${i},${oi})">✕</button>
      </div>`).join('') + `<div class="row"><button class="btn small ghost" onclick="addOption(${i})">＋ 加一个选项</button></div>`;
    }
    return `<div class="edit-q">
      ${typeSel}
      <textarea placeholder="第 ${i+1} 题题干（比如：洗手消毒的正确时长是多少？）" rows="2" oninput="draftQText(${i},this.value)">${esc(q.text)}</textarea>
      <div style="height:8px"></div>
      ${optHtml}
    </div>`;
  }).join('');
  return `<div class="card">
    <div class="back-bar"><a onclick="adminNav('home')">← 返回</a><b>出一套新考题</b></div>
    ${msgHtml()}
    <div class="form-col">
      <input placeholder="考题标题（比如：第5周 食品安全考试）" value="${esc(d.title)}" maxlength="30" oninput="draftTitle(this.value)">
    </div>
  </div>
  ${qs}
  <div class="card">
    <button class="btn small ghost block" style="width:auto" onclick="addQuestion()">＋ 再加一道题</button>
  </div>
  <button class="btn block" onclick="saveQuiz(0)">💾 完成并存草稿</button>
  <button class="btn block" style="margin-top:10px;background:var(--green);color:#fff" onclick="saveQuiz(1)">🚀 发布给员工</button>
  <div style="height:20px"></div>`;
}

function viewManage(){
  const qs = [...state.quizzes].sort((a,b) => (b.createdAt||'').localeCompare(a.createdAt||''));
  let list = '';
  if (!qs.length) list = '<div class="empty-tip">还没有考题，点「出一套新考题」开始吧</div>';
  else list = qs.map(q => {
    const subCount = Object.keys(state.submissions[q.id]||{}).length;
    return `<div class="manage-item">
      <div class="t">
        ${esc(q.title)}
        <div class="meta">${q.questions.length} 题 · ${dateOnly(q.createdAt)} · ${subCount} 人已答</div>
      </div>
      ${q.published ? '<span class="tag pub">已发布</span>' : '<span class="tag draft">草稿</span>'}
      <button class="btn small ghost" onclick="togglePublish('${q.id}',${q.published?0:1})">${q.published?'下线':'发布'}</button>
      <button class="btn small ghost" onclick="openBoard('${q.id}')">成绩</button>
      <button class="del-btn" onclick="rmQuiz('${q.id}')">✕</button>
    </div>`;
  }).join('');
  return `<div class="card">
    <div class="back-bar"><a onclick="adminNav('home')">← 返回</a><b>管理考题</b><span class="sub"></span></div>
    ${msgHtml()}
    ${list}
  </div>
  <button class="btn block ghost" onclick="adminNav('editor')">＋ 出一套新考题</button>
  <div style="height:20px"></div>`;
}

function viewBoard(){
  const qs = [...state.quizzes].sort((a,b) => (b.createdAt||'').localeCompare(a.createdAt||''));
  let list = '';
  if (!qs.length) list = '<div class="empty-tip">还没有考题</div>';
  else list = qs.map(q => {
    const subs = state.submissions[q.id] || {};
    const n = Object.keys(subs).length;
    return `<div class="quiz-item" onclick="openBoard('${q.id}')">
      <div class="t">
        <div class="title">${esc(q.title)}</div>
        <div class="meta">${q.questions.length} 题 · ${n} 人已答</div>
      </div><span class="tag todo">查看 →</span>
    </div>`;
  }).join('');
  return `<div class="card">
    <div class="back-bar"><a onclick="adminNav('home')">← 返回</a><b>成绩看板</b></div>
    ${msgHtml()}
    ${list}
  </div>`;
}

function viewBoardQuiz(){
  const q = getQuiz(boardQuizId);
  if (!q) { view = 'board'; return viewBoard(); }
  const subs = state.submissions[q.id] || {};
  const names = Object.keys(subs).sort((a,b) => subs[b].score - subs[a].score);
  window._boardNames = names;
  window._boardQuizId = q.id;
  let list = '';
  if (!names.length) list = '<div class="empty-tip">还没有人答这套题</div>';
  else list = names.map((n, idx) => {
    const r = subs[n];
    const pct = r.total ? Math.round(r.score/r.total*100) : 0;
    const cls = pct >= 60 ? 'pass' : 'fail';
    return `<div class="score-row" onclick="showDetail(${idx})">
      <span class="name">${esc(n)}</span>
      <span class="sc ${cls}">${fmtScore(r)} 分</span>
      <span class="tm">${esc(r.submittedAt||'')}</span>
      <span class="tag todo">详情</span>
    </div>`;
  }).join('');
  return `<div class="card">
    <div class="back-bar"><a onclick="adminNav('board')">← 返回</a><b>${esc(q.title)} · 成绩</b></div>
    ${msgHtml()}
    ${list}
  </div>
  <div class="switch-link"><a onclick="showCorrect('${q.id}')">查看这套题的正确答案</a></div>`;
}

window.showDetail = function(idx){
  const quizId = window._boardQuizId;
  const q = getQuiz(quizId);
  const name = (window._boardNames || [])[idx];
  const r = quizId && name ? (state.submissions[quizId]||{})[name] : null;
  if (!q || !r) return;
  let html = q.questions.map((qq, i) => {
    const my = r.answers[i];
    const right = qq.answer === my;
    const opts = qq.options.map((o, oi) => {
      let cls = '';
      if (oi === qq.answer) cls = 'right';
      else if (oi === my) cls = 'wrong';
      const mark = oi === qq.answer ? '✓' : (oi === my ? '✗' : '');
      return `<div class="opt ${cls}" style="cursor:default">
        <span class="dot">${mark}</span><span class="otxt">${esc(o)}</span>
        ${oi===my?'<span style="font-size:11px;color:var(--text-sub);margin-left:auto">他/她选的</span>':''}
      </div>`;
    }).join('');
    return `<div class="q-card">
      <div class="q-num"><span>第 ${i+1} 题</span><span class="tag ${right?'done':'fail'}" style="${right?'':'background:#FFECEC;color:#C0392B'}">${right?'答对':'答错'}</span></div>
      <div class="q-text">${esc(qq.text)}</div>
      ${opts}
    </div>`;
  }).join('');
  const app = document.getElementById('app');
  app.innerHTML = `<div class="card">
    <div class="back-bar"><a onclick="render()">← 返回成绩列表</a><b>${esc(name)} · ${fmtScore(r)} 分</b></div>
  </div>
  ${html}
  <div class="switch-link"><a onclick="render()">← 返回成绩列表</a></div>`;
  window.scrollTo(0,0);
};

window.showCorrect = function(quizId){
  const q = getQuiz(quizId);
  if (!q) return;
  let html = q.questions.map((qq, i) => {
    const answerTxt = qq.options[qq.answer] || '';
    return `<div class="manage-item"><div class="t">第 ${i+1} 题：${esc(qq.text)}</div><span class="tag done">答案：${esc(answerTxt)}</span></div>`;
  }).join('');
  const app = document.getElementById('app');
  app.innerHTML = `<div class="card">
    <div class="back-bar"><a onclick="render()">← 返回成绩列表</a><b>${esc(q.title)} · 正确答案</b></div>
    ${html}
  </div>`;
  window.scrollTo(0,0);
};

function viewPassChange(){
  return `<div class="screen" style="max-width:340px">
    <span class="emoji">🔒</span>
    <h2>修改管理密码</h2>
    <p>设置后请牢记，忘记密码需管理员从后台处理</p>
    ${msgHtml()}
    <div class="form-col">
      <input id="np1" type="password" placeholder="新密码（至少4位）">
      <input id="np2" type="password" placeholder="再输入一次">
      <button class="btn block" onclick="changePassGo()">确认修改</button>
    </div>
    <div class="switch-link"><a onclick="adminNav('home')">← 返回</a></div>
  </div>`;
}

/* ================== 启动 ================== */
(async function init(){
  render();
  await pull();
  if (!profile) { view = 'role'; }
  else if (profile.role === 'staff') { view = 'staffHome'; }
  else { view = 'adminHome'; }
  render();
  setInterval(() => { if (!syncing && view !== 'editor' && view !== 'answering') pull(); }, 30000);
  document.getElementById('syncText').onclick = pull;
})();
</script>
</body>
</html>
